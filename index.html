<!doctype html>
<html lang="en">
  <head>
    <!-- Meta & SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneShop - Điện thoại chính hãng</title>
    <meta
      name="description"
      content="A modern e-commerce platform built with Vanilla JS, Tailwind, and RESTful API. Features include a dynamic shopping cart and a comprehensive admin inventory management system."
    />
    <link rel="icon" href="./src/assets/icon/customer-favicon.png" />

    <!-- Open Graph (SEO & Social) -->
    <meta property="og:title" content="PhoneShop - E-commerce Platform" />
    <meta
      property="og:description"
      content="Premium mobile phone shop with Tailwind CSS. Fast, responsive, and easy to use."
    />
    <meta
      property="og:image"
      content="https://js-capstone-shopping-admin.vercel.app/src/assets/og/og-img.png"
    />
    <meta
      property="og:url"
      content="https://js-capstone-shopping-admin.vercel.app/"
    />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <!-- App CSS (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
  </head>
  <body class="bg-gray-50 font-sans antialiased">

    <!-- ========== HEADER + MENU NGANG ========== -->
    <header class="bg-white shadow-md sticky top-0 z-50">
      <div class="container mx-auto px-4 py-3">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <!-- Logo + Brand name -->
          <div class="flex items-center gap-2" id="logo">
            <i class="fas fa-mobile-alt text-2xl text-blue-600"></i>
            <span class="text-xl font-bold text-gray-800">Phone<span class="text-blue-600">Shop</span></span>
          </div>

          <!-- Menu ngang (desktop) -->
          <ul class="hidden md:flex gap-6 text-gray-600 font-medium">
            <li><a href="#" class="hover:text-blue-600 transition">Trang chủ</a></li>
            <li><a href="#" class="hover:text-blue-600 transition">Điện thoại</a></li>
            <li><a href="#" class="hover:text-blue-600 transition">Phụ kiện</a></li>
            <li><a href="#" class="hover:text-blue-600 transition">Khuyến mãi</a></li>
            <li><a href="#" class="hover:text-blue-600 transition">Liên hệ</a></li>
          </ul>

          <!-- Icon giỏ hàng -->
          <div class="relative cursor-pointer" id="cartIconBtn">
            <i class="fas fa-shopping-cart text-xl text-gray-600 hover:text-blue-600 transition"></i>
            <span id="cartCount" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 hidden">0</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="container mx-auto px-4 py-8">
      <!-- Thanh tìm kiếm + bộ lọc -->
      <div class="bg-white rounded-xl shadow-sm p-4 mb-8">
        <div class="flex flex-col md:flex-row gap-4">
          <!-- Ô tìm kiếm -->
          <div class="flex-1">
            <div class="relative">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input
                type="text"
                id="searchInput"
                placeholder="Tìm kiếm theo tên, mô tả..."
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
              />
            </div>
          </div>
          <!-- Bộ lọc danh mục -->
          <div class="w-full md:w-64">
            <select id="filterSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
              <option value="all">📱 Tất cả loại</option>
              <option value="iPhone">🍎 iPhone</option>
              <option value="Samsung">⭐ Samsung</option>
              <option value="Xiaomi">⚡ Xiaomi</option>
              <option value="OPPO">📸 OPPO</option>
              <option value="Vivo">🔋 Vivo</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Loading spinner -->
      <div id="loadingSpinner" class="text-center py-12 hidden">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
        <p class="mt-2 text-gray-500">Đang tải sản phẩm...</p>
      </div>

      <!-- Grid sản phẩm -->
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Sản phẩm sẽ được render từ JavaScript -->
      </div>

      <!-- Thông báo không có sản phẩm -->
      <div id="noProductsMsg" class="text-center py-12 hidden">
        <i class="fas fa-box-open text-5xl text-gray-400 mb-3"></i>
        <p class="text-gray-500">Không tìm thấy sản phẩm nào</p>
      </div>
    </main>

    <!-- ========== SIDEBAR GIỎ HÀNG (ẩn ban đầu) ========== -->
    <div id="cartOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
      <div id="cartSidebar" class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-300">
        <div class="flex flex-col h-full">
          <!-- Header giỏ hàng -->
          <div class="flex justify-between items-center p-4 border-b">
            <h2 class="text-xl font-bold">
              <i class="fas fa-shopping-cart text-blue-600 mr-2"></i>
              Giỏ hàng
            </h2>
            <button id="closeCartBtn" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
          </div>

          <!-- Danh sách sản phẩm trong giỏ -->
          <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Sản phẩm sẽ render ở đây -->
          </div>

          <!-- Footer tổng tiền -->
          <div class="border-t p-4">
            <div class="flex justify-between text-lg font-bold mb-3">
              <span>Tổng cộng:</span>
              <span id="cartTotal" class="text-red-600">0₫</span>
            </div>
            <button id="checkoutBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
              Thanh toán
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast thông báo -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-5 py-2 rounded-full text-sm z-50 opacity-0 transition-opacity duration-300 pointer-events-none">
      <span id="toastMsg"></span>
    </div>

    <!-- ========== IMPORT CONTROLLER.JS ========== -->
    <script type="module" src="./src/js/customer/controller.js"></script>
  </body>
</html>
