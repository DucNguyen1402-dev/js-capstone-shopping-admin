<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <script type="module" src="./src/js/login/controller.js"></script>

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div
      class="flex min-h-dvh items-center justify-center bg-linear-to-br from-indigo-500 to-purple-500 p-1 md:p-4"
    >
      <div
        class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-black/40 opacity-0 transition-opacity duration-300"
        data-role="backdrop"
      >
        <span class="fas fa-spinner fa-spin text-4xl text-blue-600"></span>
      </div>
      <div
        class="w-full max-w-md rounded-sm border border-gray-200 bg-white p-2 shadow-sm md:rounded-xl md:p-8"
        data-component="login"
      >
        <div class="mb-8 space-y-4 text-center" data-component="header">
          <h2
            class="js-signin-title text-2xl font-bold tracking-wide text-gray-800"
            data-role="title"
          >
            Sign In
          </h2>
          <p
            class="js-signin-subtitle text-sm text-gray-500"
            data-role="description"
          >
            Please enter your details to access your account.
          </p>
        </div>

        <form
          id="loginForm"
          class="space-y-4"
          spellcheck="false"
          data-component="form"
        >
          <div>
            <label
              class="js-email-label mb-1 block cursor-pointer text-xs font-semibold tracking-wider text-gray-400"
              data-label="email"
              >EMAIL</label
            >
            <input
              type="email"
              placeholder="e.g. alice@gmail.com"
              class="js-email-input w-full rounded-sm border border-gray-300 px-4 py-2.5 text-sm transition-all outline-none focus:ring-2 focus:ring-blue-500"
              data-field="email"
            />
          </div>

          <div>
            <label
              class="js-password-label mb-1 block cursor-pointer text-xs font-semibold tracking-wider text-gray-400"
              >PASSWORD</label
            >
            <input
              type="password"
              placeholder="••••••••"
              class="js-password-input w-full rounded-sm border border-gray-300 px-4 py-2.5 text-sm transition-all outline-none focus:ring-2 focus:ring-blue-500"
              data-field="password"
            />
          </div>

          <div class="mt-5 flex items-center justify-between">
            <label
              class="flex cursor-pointer items-center text-sm text-gray-500"
            >
              <input
                type="checkbox"
                class="js-remember-checkbox mr-2 rounded border-gray-300 text-gray-900"
              />
              Remember me
            </label>
          </div>

          <button
            type="button"
            class="js-submit-btn mt-6 w-full cursor-pointer rounded-lg bg-blue-500 py-2.5 text-sm font-medium text-white shadow-sm transition-colors duration-400 hover:bg-blue-600"
            data-action="sign-in"
          >
            SIGN IN
          </button>
        </form>

        <div class="mt-8 flex justify-center border-t border-gray-100 pt-6">
          <button
            id="adminAccess"
            class="text-xs text-gray-400"
            data-action="admin-login"
          >
            <span> System Management?</span>
            <span
              class="js-admin-login cursor-pointer underline transition-colors duration-300 hover:text-gray-600"
              >Admin Login</span
            >
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
